name: searxng

services:
  searxng:
    container_name: searxng
    build:
      # Build directly from the fork's dev branch on GitHub.
      context: "https://github.com/eipox99/searxng.git#dev"
      dockerfile: container/Dockerfile
    image: searxng-yonder:dev
    restart: unless-stopped
    # Share the VPN container's network namespace. binhex-delugevpn owns the
    # published port (already configured for 8080); this service must not
    # declare its own ports in container network mode.
    network_mode: "container:binhex-delugevpn"
    environment:
      INSTANCE_NAME: "${INSTANCE_NAME:-SearXNG}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://localhost:8080/}"
      # Required. This must match Yonder's SEARXNG_SECRET.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}"
    volumes:
      # Unraid appdata path. Contains settings.yml and limiter.toml.
      - "${SEARXNG_CONFIG:-/mnt/user/appdata/searxng}:/etc/searxng"
      # Persist SearXNG's cache separately from config.
      - "searxng-cache:/var/cache/searxng"

volumes:
  searxng-cache:
